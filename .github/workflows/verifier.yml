# Vérification automatique sur un vrai Windows, à chaque envoi sur la branche de travail.
# Ne publie rien : construit le logiciel, l'analyse (PSScriptAnalyzer) et lance le test
# tests/smoke.ps1 (toutes les pages, analyses en lecture seule, chaque fenêtre ouverte puis fermée).
name: Vérifier sur Windows

on:
  push:
    branches: [prochaine-version]
    paths: ['src/**', 'native/**', 'launcher/**', 'tests/smoke.ps1', 'build.sh', '.github/workflows/verifier.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Outils de construction
        run: sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends mono-devel nsis zip
      - name: Construire
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: aerox
          path: |
            build/AEROX PC Care
            tests/smoke.ps1

  tester:
    needs: construire
    runs-on: windows-latest
    timeout-minutes: 50
    permissions:
      contents: write   # uniquement pour ranger les captures d'écran sur la branche « captures »
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aerox
          path: art

      - name: Analyse du code (PSScriptAnalyzer)
        shell: powershell
        continue-on-error: true
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) { Install-Module PSScriptAnalyzer -Scope CurrentUser -Force }
          $ex = 'PSAvoidUsingWriteHost','PSUseShouldProcessForStateChangingFunctions','PSUseApprovedVerbs','PSUseSingularNouns','PSAvoidUsingPositionalParameters','PSAvoidGlobalVars','PSUseDeclaredVarsMoreThanAssignments','PSAvoidUsingEmptyCatchBlock','PSUseBOMForUnicodeEncodedFile','PSAvoidUsingCmdletAliases','PSReviewUnusedParameter','PSUseOutputTypeCorrectly','PSAvoidTrailingWhitespace','PSUseConsistentWhitespace','PSAvoidUsingInvokeExpression','PSAvoidDefaultValueSwitchParameter','PSUseCompatibleCmdlets','PSAvoidUsingPlainTextForPassword','PSAvoidLongLines'
          function Send-Note([string]$Title, [string]$Text) {
            # Résultat lisible via l'API GitHub (annotations), par morceaux
            $lines = $Text -split "`r?`n"; $n = 0
            for ($i = 0; $i -lt $lines.Count; $i += 60) {
              $n++; $chunk = ($lines[$i..([math]::Min($i + 59, $lines.Count - 1))] -join "`n")
              $chunk = $chunk.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::notice title=$Title $n::$chunk"
            }
          }
          $r = Invoke-ScriptAnalyzer -Path 'art\build\AEROX PC Care\AeroxPCCare.ps1' -Severity Error, Warning -ExcludeRule $ex
          $txt = ($r | Sort-Object RuleName, Line | ForEach-Object { "{0} L{1} : {2}" -f $_.RuleName, $_.Line, $_.Message }) -join "`n"
          Write-Host $txt
          Send-Note 'Analyse' ("Total : $(@($r).Count)`n" + $txt)

      - name: Test complet (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $app = 'C:\aerox\app'
          New-Item -ItemType Directory -Force $app | Out-Null
          Copy-Item 'art\build\AEROX PC Care\*' $app -Recurse -Force
          $src = [IO.File]::ReadAllText("$app\AeroxPCCare.ps1")
          $i = $src.LastIndexOf('[void]$window.ShowDialog()')
          if ($i -lt 0) { throw 'point d''injection introuvable' }
          $smoke = [IO.File]::ReadAllText((Resolve-Path 'art\tests\smoke.ps1'))
          [IO.File]::WriteAllText("$app\AeroxPCCare_test.ps1", $src.Substring(0, $i) + $smoke, (New-Object Text.UTF8Encoding($true)))
          function Send-Note([string]$Title, [string]$Text, [int]$MaxChars = 3000, [int]$Max = 10) {
            # Résultat lisible via l'API GitHub (annotations). GitHub garde 10 annotations par étape au plus et coupe chacune vers
            # 4 000 octets : le texte est découpé par blocs de $MaxChars caractères au plus (une ligne n'est jamais coupée en deux
            # sauf si elle est plus longue que le bloc)
            $blocs = New-Object 'System.Collections.Generic.List[string]'; $cur = ''
            foreach ($l in ($Text -split "`r?`n")) {
              if ($l.Length -gt $MaxChars) { $l = $l.Substring(0, $MaxChars - 1) + '...' }
              if ($cur.Length -gt 0 -and ($cur.Length + $l.Length + 1) -gt $MaxChars) { $blocs.Add($cur); $cur = '' }
              $cur = $(if ($cur.Length) { $cur + "`n" + $l } else { $l })
            }
            if ($cur.Length) { $blocs.Add($cur) }
            for ($i = 0; $i -lt $blocs.Count -and $i -lt $Max; $i++) {
              $chunk = $blocs[$i].Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host ("::notice title={0} {1}::{2}" -f $Title, ($i + 1), $chunk)
            }
          }
          # Anciennes données (dossier perso, avant la 2.3.0) : reprises dans le dossier protégé, sans suivre aucun lien
          $old = Join-Path $env:LOCALAPPDATA 'AeroxPCCare'
          New-Item -ItemType Directory -Force "$old\jeux" | Out-Null
          Set-Content "$old\jeux\reprise-test.json" '{"test":1}'
          # Machine de test : aucune statistique envoyée au vrai relais (le test des statistiques utilise un faux relais local)
          Set-Content "$old\reglages.json" '{"StatsOff":true}'
          cmd /c mklink /J "$old\lien-piege" "C:\Windows\System32\drivers\etc" | Out-Null
          $env:AEROX_SMOKE_ACTIONS = '1'   # machine jetable : on teste aussi les vraies actions et leurs annulations
          # Lancé avec un chronomètre : si le test bloque, on garde l'avancement écrit étape par étape
          $code = 9
          try {
            $pr = Start-Process powershell.exe -ArgumentList @('-NoProfile', '-STA', '-ExecutionPolicy', 'Bypass', '-File', "`"$app\AeroxPCCare_test.ps1`"") -RedirectStandardOutput 'C:\aerox\test.log' -RedirectStandardError 'C:\aerox\test.err' -PassThru -NoNewWindow
            $null = $pr.Handle   # sinon ExitCode reste vide
            if ($pr.WaitForExit(30 * 60 * 1000)) { $code = $pr.ExitCode } else { try { Stop-Process -Id $pr.Id -Force } catch {} }
          } catch { Write-Host "Lancement : $($_.Exception.Message)" }
          Start-Sleep -Seconds 2
          function Read-Shared([string]$f) { try { $fs = [IO.File]::Open($f, 'Open', 'Read', 'ReadWrite'); $r = New-Object IO.StreamReader($fs, [Text.Encoding]::UTF8); $t = $r.ReadToEnd(); $r.Close(); return $t } catch { return '' } }
          $out = (Read-Shared 'C:\aerox\progress.txt') + "`n---- sortie ----`n" + (Read-Shared 'C:\aerox\test.log') + "`n" + (Read-Shared 'C:\aerox\test.err')
          if ($code -eq 9) { $out = "!!! TEST BLOQUE OU INTERROMPU (derniere etape commencee ci-dessous)`n" + $out }
          Write-Host $out
          # Le resume (echecs, bugs) d'abord, dans sa propre annotation : le detail est long et sa fin serait coupee.
          # Tout ce qui est cherche ou ecrit ici est en ASCII : ce script est lu par Windows PowerShell sans BOM (accents abimes).
          $log = Read-Shared 'C:\aerox\test.log'
          $m = [regex]::Match($log, '== Bugs enregistr\S* par le logiciel')
          $fin = if ($m.Success) { $log.Substring($m.Index) } else { '(pas de resume : le test s''est arrete avant la fin)' }
          $ko = (($out -split "`r?`n") | Where-Object { $_ -match '\[.CHEC\]|^!!!' }) -join "`n"
          Send-Note 'Resume' ("Code de sortie : $code`n$ko`n$fin") 3500 1
          Send-Note 'Test' ($out + "`nCode de sortie : $code") 3000 9
          Write-Host "Code de sortie : $code"
          exit $code

      - name: Test version portable
        shell: powershell
        run: |
          function Send-Note([string]$Title, [string]$Text, [int]$MaxChars = 3000, [int]$Max = 10) {
            # Même découpage que l'étape précédente (annotations GitHub : 10 au plus, coupées vers 4 000 octets)
            $blocs = New-Object 'System.Collections.Generic.List[string]'; $cur = ''
            foreach ($l in ($Text -split "`r?`n")) {
              if ($l.Length -gt $MaxChars) { $l = $l.Substring(0, $MaxChars - 1) + '...' }
              if ($cur.Length -gt 0 -and ($cur.Length + $l.Length + 1) -gt $MaxChars) { $blocs.Add($cur); $cur = '' }
              $cur = $(if ($cur.Length) { $cur + "`n" + $l } else { $l })
            }
            if ($cur.Length) { $blocs.Add($cur) }
            for ($i = 0; $i -lt $blocs.Count -and $i -lt $Max; $i++) {
              $chunk = $blocs[$i].Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host ("::notice title={0} {1}::{2}" -f $Title, ($i + 1), $chunk)
            }
          }
          function Read-Shared([string]$f) { try { $fs = [IO.File]::Open($f, 'Open', 'Read', 'ReadWrite'); $r = New-Object IO.StreamReader($fs, [Text.Encoding]::UTF8); $t = $r.ReadToEnd(); $r.Close(); return $t } catch { return '' } }
          $p = 'C:\aerox\cle'
          New-Item -ItemType Directory -Force $p | Out-Null
          Copy-Item 'C:\aerox\app\*' $p -Recurse -Force
          Set-Content "$p\portable.txt" 'test'
          $env:AEROX_SMOKE_PORTABLE = '1'
          $code = 9
          try {
            $pr = Start-Process powershell.exe -ArgumentList @('-NoProfile', '-STA', '-ExecutionPolicy', 'Bypass', '-File', "`"$p\AeroxPCCare_test.ps1`"") -RedirectStandardOutput 'C:\aerox\portable.log' -RedirectStandardError 'C:\aerox\portable.err' -PassThru -NoNewWindow
            $null = $pr.Handle   # sinon ExitCode reste vide
            if ($pr.WaitForExit(20 * 60 * 1000)) { $code = $pr.ExitCode } else { try { Stop-Process -Id $pr.Id -Force } catch {} }
          } catch { Write-Host "Lancement : $($_.Exception.Message)" }
          Start-Sleep -Seconds 2
          $out = (Read-Shared 'C:\aerox\portable.log') + "`n" + (Read-Shared 'C:\aerox\portable.err')
          if ($code -eq 9) { $out = "!!! TEST PORTABLE BLOQUE OU INTERROMPU`n" + $out }
          Write-Host $out
          $lignes = @($out -split "`r?`n")
          $ko = ($lignes | Where-Object { $_ -match '\[.CHEC\]|^!!!' }) -join "`n"
          $fin = ($lignes | Select-Object -Last 25) -join "`n"
          Send-Note 'Portable resume' ("Code de sortie : $code`n$ko`n--- fin du test ---`n$fin") 3500 1
          Send-Note 'Portable' $out 3000 9
          exit $code

      - name: Captures d'écran (branche « captures »)
        if: always()
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $d = 'C:\aerox\captures'
          if (-not (Test-Path "$d\*.png")) { Write-Host 'Aucune capture'; exit 0 }
          Set-Location $d
          git init -q; git checkout -q -b captures
          git add -A; git -c user.name=aerox-ci -c user.email=ci@aerox.local commit -q -m "Captures $env:GITHUB_SHA"
          git push -q -f "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git" captures
          Write-Host "Captures envoyees : $(@(Get-ChildItem *.png).Count)"
