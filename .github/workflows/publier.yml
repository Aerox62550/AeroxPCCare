# Publication automatique : quand $AppVersion (src/1_head.ps1) change sur la branche main,
# GitHub construit le logiciel et crée la Release « vX.Y.Z » avec l'installateur.
# canal.txt = « test » : publiée en pré-version (seuls les PC en canal test la reçoivent).
# canal.txt = « public » : publiée pour tout le monde ; une version de test déjà publiée passe en public.
name: Publier une version

on:
  push:
    branches: [main]
    paths: ['src/**', 'native/**', 'launcher/**', 'installer/**', 'docs/LISEZMOI.txt', 'build.sh', 'canal.txt', '.github/workflows/publier.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publier
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Numéro de version et canal
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(sed -n "s/^\$AppVersion = '\([0-9.]*\)'.*/\1/p" src/1_head.ps1)
          CANAL=$(tr -d '[:space:]' < canal.txt 2>/dev/null || echo public)
          [ "$CANAL" = "test" ] || CANAL=public
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "test=$([ "$CANAL" = test ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if gh release view "v$VER" --repo "$GITHUB_REPOSITORY" --json isPrerelease -q .isPrerelease > pre.txt 2>/dev/null; then
            echo "publier=non" >> "$GITHUB_OUTPUT"
            if [ "$(cat pre.txt)" = "true" ] && [ "$CANAL" = "public" ]; then
              echo "La version de test v$VER passe en public."
              gh release edit "v$VER" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
            else
              echo "La version v$VER est déjà publiée ($CANAL) : rien à faire."
            fi
          else
            echo "publier=oui" >> "$GITHUB_OUTPUT"
          fi

      - name: Outils de construction
        if: steps.v.outputs.publier == 'oui'
        run: sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends mono-devel nsis zip

      - name: Construire
        if: steps.v.outputs.publier == 'oui'
        run: ./build.sh

      - name: Publier la Release
        if: steps.v.outputs.publier == 'oui'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: AEROX PC Care ${{ steps.v.outputs.version }}${{ steps.v.outputs.test == 'true' && ' (test)' || '' }}
          prerelease: ${{ steps.v.outputs.test == 'true' }}
          make_latest: ${{ steps.v.outputs.test == 'true' && 'false' || 'true' }}
          generate_release_notes: true
          body: |
            ## ⬇ Installer AEROX PC Care
            Télécharge **`AeroxPCCare_Setup.exe`** ci-dessous (dans « Assets ») et lance-le.
            Si Windows affiche « Windows a protégé votre ordinateur » : *Informations complémentaires* > *Exécuter quand même*.

            Déjà installé ? Rien à faire : le logiciel propose la mise à jour tout seul au démarrage.
            ⚠️ « Source code » = le code du logiciel, pas le programme à installer.
          files: |
            build/AeroxPCCare_Setup.exe
