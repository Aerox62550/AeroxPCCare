# Publication automatique : quand $AppVersion (src/1_head.ps1) change sur la branche main,
# GitHub construit le logiciel et crée la Release « vX.Y.Z » avec le zip (mises à jour
# automatiques) et l'installateur. Si cette version est déjà publiée, rien ne se passe.
name: Publier une version

on:
  push:
    branches: [main]
    paths: ['src/**', 'native/**', 'launcher/**', 'installer/**', 'docs/LISEZMOI.txt', 'build.sh', '.github/workflows/publier.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publier
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Numéro de version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(sed -n "s/^\$AppVersion = '\([0-9.]*\)'.*/\1/p" src/1_head.ps1)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if gh release view "v$VER" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La version v$VER est déjà publiée : rien à faire (augmente \$AppVersion pour publier)."
            echo "publier=non" >> "$GITHUB_OUTPUT"
          else
            echo "publier=oui" >> "$GITHUB_OUTPUT"
          fi

      - name: Outils de construction
        if: steps.v.outputs.publier == 'oui'
        run: sudo apt-get update && sudo apt-get install -y mono-devel nsis zip

      - name: Construire
        if: steps.v.outputs.publier == 'oui'
        run: ./build.sh

      - name: Publier la Release
        if: steps.v.outputs.publier == 'oui'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: AEROX PC Care ${{ steps.v.outputs.version }}
          generate_release_notes: true
          body: |
            ## ⬇ Installer AEROX PC Care
            Télécharge **`AeroxPCCare_Setup.exe`** ci-dessous (dans « Assets ») et lance-le.
            Si Windows affiche « Windows a protégé votre ordinateur » : *Informations complémentaires* > *Exécuter quand même*.

            Déjà installé ? Rien à faire : le logiciel propose la mise à jour tout seul au démarrage.
            ⚠️ « Source code » = le code du logiciel, pas le programme à installer.
          files: |
            build/AeroxPCCare_v*.zip
            build/AeroxPCCare_Setup.exe
